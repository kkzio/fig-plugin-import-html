<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sample Landing</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, Arial, sans-serif; color: #1b1d29; background: #f6f7fb; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 64px; background: #fff; border-bottom: 1px solid #e3e5ee;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
  .logo svg { width: 28px; height: 28px; color: #5b5bf7; }
  nav a { margin-left: 28px; color: #5a5e73; text-decoration: none; font-size: 15px; }
  .hero {
    padding: 96px 64px; text-align: center; color: #fff;
    background: linear-gradient(135deg, #5b5bf7 0%, #a046e8 100%);
  }
  .hero h1 { margin: 0 0 16px; font-size: 56px; line-height: 1.1; letter-spacing: -1px; }
  .hero p { margin: 0 auto 32px; max-width: 560px; font-size: 18px; line-height: 1.6; opacity: 0.9; }
  .cta {
    display: inline-block; padding: 14px 28px; border-radius: 999px; border: 0;
    background: #fff; color: #5b5bf7; font-weight: 600; font-size: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 64px; }
  .card {
    background: #fff; border-radius: 16px; padding: 28px; border: 1px solid #e3e5ee;
    box-shadow: 0 2px 8px rgba(27, 29, 41, 0.06);
  }
  .card h3 { margin: 0 0 8px; font-size: 20px; }
  .card p { margin: 0; color: #5a5e73; line-height: 1.5; }
  .badge {
    display: inline-block; margin-bottom: 16px; padding: 4px 10px; border-radius: 6px;
    background: #eef0ff; color: #5b5bf7; font-size: 12px; font-weight: 600; text-transform: uppercase;
  }
  .signup { display: flex; justify-content: center; gap: 12px; padding: 0 64px 80px; }
  .signup input {
    width: 320px; padding: 12px 16px; border: 1px solid #c9ccda; border-radius: 10px; font-size: 15px;
  }
  .signup button {
    padding: 12px 24px; border: 0; border-radius: 10px; background: #1b1d29; color: #fff;
    font-size: 15px; font-weight: 600;
  }
  .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="9" /><path d="M8 12l3 3 5-6" />
      </svg>
      Acme
    </div>
    <nav><a href="#">Features</a><a href="#">Pricing</a><a href="#">Docs</a></nav>
  </header>

  <section class="hero">
    <h1>Ship designs faster</h1>
    <p>Turn any HTML page into editable Figma layers in seconds — frames, text, images and vectors.</p>
    <button class="cta">Get started free</button>
  </section>

  <!-- Cards are generated by JavaScript to check that scripts run before serializing. -->
  <section class="features" id="features"></section>

  <div class="signup">
    <input type="email" placeholder="you@example.com" />
    <button>Join waitlist</button>
  </div>

  <div class="hidden">This should not be imported.</div>

  <script>
    const features = [
      ['Fast', 'Instant import', 'Paste a file and get layers right away.'],
      ['Accurate', 'Pixel positions', 'Every box is measured by a real browser.'],
      ['Editable', 'Real text', 'Text stays text, with fonts and colors.'],
    ];
    document.getElementById('features').innerHTML = features
      .map(([badge, title, body]) =>
        `<div class="card"><span class="badge">${badge}</span><h3>${title}</h3><p>${body}</p></div>`)
      .join('');
  </script>
</body>
</html>
