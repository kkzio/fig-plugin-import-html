<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Visuals Test</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; font-family: Inter, Arial, sans-serif; background: #f4f5f9; color: #1b1d29; }
  h2 { margin: 32px 0 12px; font-size: 18px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  .tile { width: 200px; height: 120px; border-radius: 14px; }

  /* Gradients */
  .g1 { background: linear-gradient(135deg, #5b5bf7 0%, #a046e8 100%); }
  .g2 { background: linear-gradient(to right, #ff7a18, #af002d 70%, #319197); }
  .g3 { background: radial-gradient(circle at 30% 30%, #ffe259, #ffa751 60%, #e53935); }
  .g4 { background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #000 100%), linear-gradient(90deg, #00c6ff, #0072ff); }
  .g5 { background: linear-gradient(#fff, transparent), #16a34a; }

  /* Shadows */
  .s { background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .s1 { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
  .s2 { box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 12px 32px -6px rgba(91, 91, 247, 0.45); }
  .s3 { box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.25); background: #eceef4; }
  .s4 { font-size: 36px; font-weight: 800; color: #fff; text-shadow: 2px 3px 0 #5b5bf7; background: #1b1d29; }

  /* Images */
  img { display: block; }
  .cover { width: 200px; height: 120px; object-fit: cover; border-radius: 14px; }
  .contain { width: 200px; height: 120px; object-fit: contain; background: #fff; border: 1px solid #d9dce6; border-radius: 14px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .bg-cover {
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%23dbeafe'/><circle cx='20' cy='20' r='10' fill='%232563eb'/></svg>") center / cover;
  }
  .bg-tile {
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect width='20' height='20' fill='%23fef3c7'/><circle cx='10' cy='10' r='3' fill='%23d97706'/></svg>") repeat;
  }
</style>
</head>
<body>
  <h2>Gradients</h2>
  <div class="row">
    <div class="tile g1"></div><div class="tile g2"></div><div class="tile g3"></div>
    <div class="tile g4"></div><div class="tile g5"></div>
  </div>

  <h2>Shadows</h2>
  <div class="row">
    <div class="tile s s1">box-shadow</div>
    <div class="tile s s2">2 layers</div>
    <div class="tile s s3">inset</div>
    <div class="tile s s4">Text</div>
  </div>

  <h2>Images</h2>
  <div class="row">
    <img class="cover" id="canvas-img" alt="generated" />
    <img class="contain" alt="svg"
      src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 60'><rect width='100' height='60' rx='8' fill='%235b5bf7'/><text x='50' y='38' font-size='20' text-anchor='middle' fill='white' font-family='Arial'>SVG</text></svg>" />
    <div class="tile bg-cover"></div>
    <div class="tile bg-tile"></div>
    <img class="avatar" id="avatar" alt="avatar" />
    <img class="cover" alt="remote" src="https://picsum.photos/id/1015/400/240" />
  </div>

  <script>
    // Images drawn by script, to check that generated data URIs are picked up.
    function generated(w, h, draw) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      return c.toDataURL('image/png');
    }
    document.getElementById('canvas-img').src = generated(400, 240, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#0ea5e9'); g.addColorStop(1, '#22c55e');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = 'bold 48px Arial'; ctx.fillText('PNG', 40, 140);
    });
    document.getElementById('avatar').src = generated(128, 128, (ctx) => {
      ctx.fillStyle = '#f97316'; ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(64, 50, 24, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(64, 130, 44, 0, 7); ctx.fill();
    });
  </script>
</body>
</html>
